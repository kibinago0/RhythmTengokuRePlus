name: Build Rhythm Tengoku RePlus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils-arm-none-eabi \
            git \
            libpng-dev \
            ffmpeg \
            python3 \
            wget \
            curl

      - name: Download baserom.gba
        env:
          ROM_URL: ${{ secrets.ROM_GDRIVE_URL }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.request

          url = os.environ["ROM_URL"]

          match = re.search(r'/file/d/([^/]+)', url)

          if not match:
              raise SystemExit(
                  "Google Driveの共有URLからファイルIDを取得できません"
              )

          file_id = match.group(1)

          download_url = (
              "https://drive.usercontent.google.com/download"
              "?id=" + file_id +
              "&export=download&confirm=t"
          )

          print("Downloading baserom.gba...")
          urllib.request.urlretrieve(
              download_url,
              "baserom.gba"
          )
          PY

          echo "ROM:"
          ls -lh baserom.gba
          file baserom.gba

      - name: Install devkitPro
        run: |
          wget -O install-devkitpro-pacman \
            https://www.shaffy.fr/install-devkitpro-pacman

          sed -i 's/\r$//' install-devkitpro-pacman

          chmod +x install-devkitpro-pacman

          sudo ./install-devkitpro-pacman

      - name: Setup devkitPro
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          echo "DEVKITPPC=/opt/devkitpro/devkitPPC" >> "$GITHUB_ENV"

      - name: Install GBA development tools
        run: |
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm gba-dev

      - name: Build agbcc
        run: |
          git clone https://github.com/pret/agbcc.git

          cd agbcc

          ./build.sh

          ./install.sh ../RhythmTengokuRePlus

          cd ..

      - name: Verify agbcc installation
        run: |
          echo "=== agbcc ==="
          ls -l tools/agbcc/bin/

          echo "=== agbcc headers ==="
          ls -l tools/agbcc/include/ | head -50

          echo "=== stdint.h ==="

          if [ ! -f tools/agbcc/include/stdint.h ]; then
            echo "stdint.h is missing. Repairing agbcc headers..."

            cp -v ../agbcc/ginclude/* tools/agbcc/include/

            cp -rv ../agbcc/libc/include/* tools/agbcc/

          fi

          test -f tools/agbcc/include/stdint.h

          echo "stdint.h found:"
          ls -l tools/agbcc/include/stdint.h

      - name: Check ROM
        run: |
          echo "=== ROM SHA1 ==="
          sha1sum baserom.gba

          echo "=== ROM CRC32 ==="
          sha256sum baserom.gba

      - name: Build DEBUG + PLAYTEST
        run: |
          make distclean
          make -j"$(nproc)" FEATURES="PLAYTEST DEBUG"

      - name: Check build result
        run: |
          echo "=== Build directory ==="
          ls -lah build/

          test -f build/*.gba

      - name: Prepare ROM
        run: |
          mkdir -p release

          cp build/*.gba \
            release/RhythmTengokuRePlus-DEBUG.gba

          ls -lh release/

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: RhythmTengokuRePlus-DEBUG
          path: release/RhythmTengokuRePlus-DEBUG.gba
          if-no-files-found: error
